import cool.furry.mc.projectexpansion.Data
import cool.furry.mc.projectexpansion.GeneratorLock
import cool.furry.mc.projectexpansion.SignJar
import cool.furry.mc.projectexpansion.TestReport

plugins {
    id 'com.github.spotbugs' version '6.0.22' apply false
}

// Each version's test run adds itself to this, see testRuns in subprojects below
var testReport = tasks.register("testReport", TestReport) {
    group = "verification"
    description = "Writes a report of the test runs in this build to reports/"
    reportsDirectory = layout.projectDirectory.dir("reports")
}

// Shared setup for every version subproject. Loader specific setup lives in versions/<version>/build.gradle.
// Java sources are layered: each src/<layer>/java listed in the version's shared_java property, then versions/<version>/src/main.
// Resources come from src/common, src/<loader>, versions/<version>/src/main and versions/<version>/src/generated.
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'com.github.spotbugs'

    version = minecraft_version + "-" + mod_version
    group = mod_group_id

    base {
        archivesName = mod_id
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenLocal()
        maven { url = "https://modmaven.dev/" }
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name "curios"
            url "https://maven.theillusivec4.top/"
            content {
                includeGroup 'top.theillusivec4.curios'
            }
        }
        maven {
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
    }

    sourceSets.main {
        shared_java.split(',').findAll { !it.isBlank() }.each { java.srcDir rootProject.file("src/${it.trim()}/java") }
        resources.srcDirs rootProject.file('src/common/resources'), rootProject.file("src/${loader}/resources"), 'src/generated/resources'
    }

    // GameTests get their own source set so they stay out of release jars. Versions opt in with gametest_layers,
    // which works like shared_java but for src/<layer>/gametest, followed by versions/<version>/src/gametest.
    if (project.hasProperty("gametest_layers")) {
        sourceSets.create("gametest") {
            gametest_layers.split(',').findAll { !it.isBlank() }.each {
                java.srcDir rootProject.file("src/${it.trim()}/gametest/java")
                resources.srcDir rootProject.file("src/${it.trim()}/gametest/resources")
            }
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
        configurations {
            gametestImplementation.extendsFrom implementation
            gametestCompileOnly.extendsFrom compileOnly
            gametestRuntimeOnly.extendsFrom runtimeOnly
        }
    }

    spotbugs {
        toolVersion = '4.8.3'
        //noinspection UnnecessaryQualifiedReference
        effort = com.github.spotbugs.snom.Effort.MORE
        //noinspection UnnecessaryQualifiedReference
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf("LOW")
        ignoreFailures.set(true)
    }

    // SpotBugs itself needs a newer java than 1.16.5's java 8
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }

    // This block of code expands all declared replace properties in the specified resource targets.
    // A missing property will result in an error. Properties are expanded using ${} Groovy notation.
    var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
        var replaceProperties = [minecraft_version      : minecraft_version,
                                 minecraft_version_range: minecraft_version_range,
                                 loader_version_range   : loader_version_range,
                                 projecte_version_range : projecte_version_range,
                                 pack_format            : pack_format,
                                 mod_id                 : mod_id,
                                 mod_name               : mod_name,
                                 mod_license            : mod_license,
                                 mod_version            : version,
                                 mod_authors            : mod_authors,
                                 mod_description        : mod_description]
        if (loader == 'neoforge') {
            replaceProperties.neo_version_range = neo_version_range
        } else {
            replaceProperties.forge_version_range = forge_version_range
        }
        inputs.properties replaceProperties
        expand replaceProperties
        from rootProject.file("src/common/templates")
        from rootProject.file("src/${loader}/templates")
        into layout.buildDirectory.dir("generated/sources/modMetadata")
    }

    // Include the output of "generateModMetadata" as an input directory for the build
    // this works with both building through Gradle and the IDE.
    sourceSets.main.resources.srcDir generateModMetadata

    // IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    tasks.named("jar", Jar) {
        doFirst {
            def jarDir = archiveFile.get().asFile.parentFile
            jarDir.listFiles(new FilenameFilter() {
                boolean accept(File dir, String name) {
                    return name.endsWith(".jar")
                }
            })?.each { file ->
                getLogger().log(LogLevel.WARN, "Deleting old jar: ${file.name}")
                file.delete()
            }
        }
    }

    // Forge reobfuscates into build/libs after jar, so sign whichever runs last
    var signJar = tasks.register("signJar", SignJar) {
        dependsOn(tasks.matching { it.name == "jar" || it.name == "reobfJar" })
        inputFile = layout.buildDirectory.file("libs/${mod_id}-${project.version}.jar")
        outputFile = layout.buildDirectory.file("libs/signed/${mod_id}-${project.version}.jar")
        scriptFile = rootProject.file("scripts/sign-jar.sh")
        secretsFile = rootProject.file("scripts/secrets.sh")
        group = "build"
    }
    tasks.matching { it.name == "jar" || it.name == "reobfJar" }.configureEach { finalizedBy(signJar) }

    // the signed jar scripts/publish.sh uploads, see src/publish
    tasks.register("releaseJar") {
        dependsOn(signJar)
        // only release once every GameTest passes, runGameTestServer fails if any don't
        if (project.hasProperty("gametest_layers")) dependsOn("runGameTestServer")
        group = "publishing"
    }

    // Generates models, blockstates, recipes and such into src/generated/resources
    var generatorLock = gradle.sharedServices.registerIfAbsent("generatorLock", GeneratorLock) { maxParallelUsages = 1 }
    var data = tasks.register("data", Data) {
        usesService(generatorLock)
        scriptFile = rootProject.file("scripts/generate-assets.sh")
        inputFiles.from(rootProject.fileTree("src/generation") { include "src/**", "templates/**", "package.json", "bun.lock" })
        minecraftVersion = minecraft_version
        loader = project.loader
        outputDirectory = file("src/generated/resources")
        group = "build"
    }
    tasks.named("processResources") { dependsOn(data) }

    // Accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for dev servers, since run/ isn't committed
    var eulaFile = file("run/eula.txt")
    tasks.matching { it.name == "runServer" }.configureEach {
        doFirst {
            eulaFile.parentFile.mkdirs()
            eulaFile.text = "eula=true\n"
        }
    }

    // Test runs write their results to a file for the report, the property being where each framework looks for it.
    // A failing run doesn't stop the build, so every version's tests still run, the report fails it afterwards instead.
    var testRuns = [runGameTestServer: "projectexpansion.testResults", runServerTest: "mcjunitlib.resultsFile"]
    var testVersion = minecraft_version, testLoader = loader
    tasks.matching { testRuns.containsKey(it.name) }.configureEach { JavaExec run ->
        var results = layout.buildDirectory.file("test-results/${run.name}/results.json").get().asFile
        run.systemProperty(testRuns[run.name], results.absolutePath)
        run.ignoreExitValue = true
        run.doFirst { results.delete() }
        run.finalizedBy(testReport)
        testReport.get().run(testVersion, testLoader, run, results)
    }
}

// Runs every version's tests, ./gradlew gameTest, then writes a report to reports/
tasks.register("gameTest") {
    group = "verification"
    description = "Runs every version's tests and writes a report to reports/"
    // game tests from 1.18 on, MCJUnitLib on 1.16.5
    dependsOn subprojects.collect { it.tasks.matching { task -> task.name in ["runGameTestServer", "runServerTest"] } }
}

// Runs the resource generator's tests, ./gradlew generatorTest
tasks.register("generatorTest", Exec) {
    group = "verification"
    description = "Runs the resource generator's tests"
    workingDir file("src/generation")
    commandLine "bun", "test"
}
