loader=forge
# 1.16.5 still uses MCP class names (net.minecraft.item.ItemStack), so it can't share java sources with the other versions
shared_java=
java_version=8
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=cool.furry.mc

minecraft_version=1.16.5
minecraft_version_range=[1.16.5]
forge_version=36.2.34
forge_version_range=[36.2,)
# The loader version range can only use the major version of Forge as bounds
loader_version_range=[36,)
pack_format=6

# projecte 1.16 versions are prefixed with "PE", so they can't be compared
projecte_version_range=*
# 1.16.5-PE1.0.2
projecte_version = 3736621
curios_version   = 1.16.5-4.1.0.1
jei_version = 7.8.1.1018
junit_platform_version = 1.6.2
junit_jupiter_version = 5.4.2
