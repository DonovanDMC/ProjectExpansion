// ModDevGradle Legacy only supports 1.17+, so 1.16.5 uses ForgeGradle
plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // makes optional (require = 0) injections still fail in dev if they don't apply
            property 'mixin.debug.countInjections', 'true'
            // mixins in dev need to be told about the refmap
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            arg '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:projecte-226410:${projecte_version}")
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
    compileOnly("org.jetbrains:annotations:24.1.0")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}:api")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}")
}

tasks.named("jar", Jar) {
    manifest.attributes("MixinConfigs": "${mod_id}.mixins.json")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
