// ModDevGradle Legacy only supports 1.17+, so 1.16.5 uses ForgeGradle
plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

// MCJUnitLib, copied into src/mcjunitlib since it's archived upstream, see the README there
sourceSets {
    mcjunitlib {
        java.srcDirs = ['src/mcjunitlib/java']
        resources.srcDirs = ['src/mcjunitlib/resources']
    }
    test {
        compileClasspath += mcjunitlib.output
        runtimeClasspath += mcjunitlib.output
    }
}

configurations {
    // the tests already get minecraft through main
    mcjunitlibCompileOnly.extendsFrom minecraft
    testImplementation.extendsFrom mcjunitlibImplementation
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // makes optional (require = 0) injections still fail in dev if they don't apply
            property 'mixin.debug.countInjections', 'true'
            // mixins in dev need to be told about the refmap
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            arg '--nogui'
        }

        // runs the tests in src/test with MCJUnitLib, as 1.16.5 has no game test server
        serverTest {
            parent runs.server
            main 'com.alcatrazescapee.mcjunitlib.DedicatedTestServerLauncher'
            environment 'target', 'fmltestserver'
            environment 'targetModId', mod_id
            arg '--crashOnFailedTests'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.test
                    // loads it through forge's class loader, like the library jar's manifest used to
                    source sourceSets.mcjunitlib
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:projecte-226410:${projecte_version}")
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
    compileOnly("org.jetbrains:annotations:24.1.0")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}:api")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}")
    // the versions mcjunitlib was built with
    mcjunitlibImplementation "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
    mcjunitlibImplementation "org.junit.jupiter:junit-jupiter-api:${junit_jupiter_version}"
    mcjunitlibImplementation "org.junit.jupiter:junit-jupiter-engine:${junit_jupiter_version}"
    mcjunitlibImplementation "org.junit.jupiter:junit-jupiter-params:${junit_jupiter_version}"
}

tasks.named("jar", Jar) {
    manifest.attributes("MixinConfigs": "${mod_id}.mixins.json")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
